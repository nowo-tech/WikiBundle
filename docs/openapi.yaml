# Wiki REST API (spec 218). Kept in step with the routes by ApiOpenApiTest.
openapi: 3.1.0
info:
  title: WikiBundle REST API
  version: 1.24.0
  description: Spec 218. Off unless nowo_wiki.api.enabled. Paths are relative to api.prefix (default /api/wiki/v1). See docs/API.md
    for levels, where, the host's hooks and every error code.
servers:
- url: /api/wiki/v1
security:
- token: []
paths:
  /search:
    get:
      operationId: search
      summary: Search the wikis in reach
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
      - name: wiki
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Repeatable; default every wiki in reach.
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page of the list, from 0; 100 rows per page.
  /wikis:
    get:
      operationId: wikis_list
      summary: Wikis the token may list
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: owner_type
        in: query
        required: false
        schema:
          type: string
        description: Filter by owner type.
      - name: owner_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by owner id.
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
        description: Archived wikis only (true) or active ones only (false).
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page of the list, from 0; 100 rows per page.
    post:
      operationId: wiki_create
      summary: Create a wiki (host hook)
      description: 'Level: Full. The person''s access and the token''s where still apply.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wiki'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiCreate'
  /wikis/{wiki}:
    get:
      operationId: wiki_get
      summary: One wiki
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wiki'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
    patch:
      operationId: wiki_update
      summary: Rename or describe a wiki (host hook)
      description: 'Level: Full. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wiki'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiPatch'
  /wikis/{wiki}/archive:
    post:
      operationId: wiki_archive
      summary: Archive a wiki (host hook)
      description: 'Level: Full. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wiki'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - $ref: '#/components/parameters/IdempotencyKey'
  /wikis/{wiki}/files:
    post:
      operationId: file_upload
      summary: Upload a file (host hook)
      description: 'Level: Edit. The person''s access and the token''s where still apply.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
  /wikis/{wiki}/files/{file}:
    get:
      operationId: file_download
      summary: Download a file (host hook), as an attachment
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: 'The file, `Content-Disposition: attachment`, `Content-Security-Policy: default-src ''none''; sandbox`'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: file
        in: path
        required: true
        schema:
          type: string
  /wikis/{wiki}/pages:
    get:
      operationId: pages_list
      summary: Pages of a wiki, metadata only
      description: 'Level: Read (archived: Edit). The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: parent
        in: query
        required: false
        schema:
          type: string
        description: A page id, or `root` for the top level.
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
        description: Archived pages (needs Edit and Archive).
      - name: updated_since
        in: query
        required: false
        schema:
          type: integer
        description: Unix milliseconds.
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page of the list, from 0; 100 rows per page.
    post:
      operationId: page_create
      summary: Create a page
      description: 'Level: Edit. The person''s access and the token''s where still apply.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageCreate'
  /wikis/{wiki}/pages/{page}:
    get:
      operationId: page_get
      summary: One page with its body in the token's view
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
    put:
      operationId: page_update
      summary: Save a page from a known revision
      description: 'Level: Edit. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageUpdate'
  /wikis/{wiki}/pages/{page}/archive:
    post:
      operationId: page_archive
      summary: Archive a page
      description: 'Level: Edit (own pages) / Full. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
      - $ref: '#/components/parameters/IdempotencyKey'
  /wikis/{wiki}/pages/{page}/comments/{comment}:
    patch:
      operationId: comment_edit
      summary: Edit one's own comment
      description: 'Level: Edit. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
      - name: comment
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBody'
    delete:
      operationId: comment_delete
      summary: Delete a comment
      description: 'Level: Edit (own) / Full (ModerateComments). The person''s access and the token''s where still apply.'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
      - name: comment
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
  /wikis/{wiki}/pages/{page}/files:
    get:
      operationId: page_files
      summary: Files the page shows (host hook)
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
  /wikis/{wiki}/pages/{page}/move:
    post:
      operationId: page_move
      summary: Move a page in the tree
      description: 'Level: Edit. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageMove'
  /wikis/{wiki}/pages/{page}/revisions:
    get:
      operationId: revisions_list
      summary: History, newest first
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page of the list, from 0; 100 rows per page.
  /wikis/{wiki}/pages/{page}/revisions/{number}:
    get:
      operationId: revision_get
      summary: One revision in the page's view
      description: 'Level: Read. The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: wiki
        in: path
        required: true
        schema:
          type: string
        description: The wiki's slug.
      - name: page
        in: path
        required: true
        schema:
          type: string
        description: The page's UUID.
      - name: number
        in: path
        required: true
        schema:
          type: string
  /wikis/{wiki}/pages/{page}/revisions/{number}/diff:
    get:
      operationId: revision_diff
      summary: Line diff of two revisions' sources
      description: 'Level: Edit (source). The person''s access and the token''s where still apply.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diff'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
