components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: The host's personal token, in the Authorization header only (with or without Bearer).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: A retry with the same key within 24 hours gets the first successful answer again.
  responses:
    Error:
      description: A refusal; see docs/API.md for the codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        err:
          type: string
        ECODE:
          type: string
      required:
      - err
      - ECODE
      additionalProperties: true
      description: Every refusal. A conflict adds current_revision, updated_by and updated_at.
    Warning:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
          enum:
          - unknown
          - not_supported
      required:
      - field
      - reason
    Person:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type: string
      required:
      - id
      - name
      description: The name the history policy shows; an id only for the token's own user.
    Wiki:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        slug:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        owner_type:
          type:
          - string
          - 'null'
        owner_id:
          type:
          - string
          - 'null'
        archived:
          type: boolean
        restricted:
          type: boolean
        can_open:
          type: boolean
        created_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        updated_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        page_count:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      required:
      - id
      - slug
      - name
      - description
      - owner_type
      - owner_id
      - archived
      - restricted
      - can_open
      - created_at
      - updated_at
    WikiList:
      type: object
      properties:
        wikis:
          type: array
          items:
            $ref: '#/components/schemas/Wiki'
        last_page:
          type: boolean
      required:
      - wikis
      - last_page
    WikiCreate:
      type: object
      properties:
        owner_type:
          type: string
        owner_id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
      - owner_type
      - owner_id
      - name
    WikiPatch:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    PageHead:
      type: object
      properties:
        id:
          type: string
        wiki:
          type: string
        slug:
          type: string
        title:
          type: string
        parent:
          type:
          - string
          - 'null'
        position:
          type: integer
        archived:
          type: boolean
        revision:
          type:
          - integer
          - 'null'
        created_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        updated_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        updated_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
          description: The author of the page's oldest stored revision (spec 234), presented like updated_by.
        channel:
          type:
          - string
          - 'null'
          enum:
          - web
          - app
          - api
          - mcp
          - null
          description: Where the last write came from (spec 234), as the host recorded it; null when not recorded.
        token_name:
          type:
          - string
          - 'null'
          maxLength: 120
          description: The host's plain-text actor label of the last write (spec 234), e.g. a token name; never a secret.
            Null when not recorded or once its author is deleted. Plain text, escape it when rendering HTML.
      required:
      - id
      - wiki
      - slug
      - title
      - parent
      - position
      - archived
      - revision
      - created_at
      - updated_at
      - updated_by
      - created_by
      - channel
      - token_name
    PageList:
      type: object
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageHead'
        last_page:
          type: boolean
      required:
      - pages
      - last_page
    Page:
      allOf:
      - $ref: '#/components/schemas/PageHead'
      - type: object
        properties:
          format:
            type: string
            enum:
            - markdown
            - html
          content_view:
            type: string
            enum:
            - source
            - viewer
          content_markdown:
            type:
            - string
            - 'null'
          content_text:
            type: string
          warnings:
            type: array
            items:
              $ref: '#/components/schemas/Warning'
        required:
        - format
        - content_view
        - content_markdown
    PageCreate:
      type: object
      properties:
        title:
          type: string
        content_markdown:
          type: string
        parent:
          type: string
        slug:
          type: string
      required:
      - title
    PageUpdate:
      type: object
      properties:
        title:
          type: string
        content_markdown:
          type: string
        base_revision:
          type: integer
        allow_empty:
          type: boolean
      required:
      - content_markdown
      - base_revision
    PageMove:
      type: object
      properties:
        parent:
          type:
          - string
          - 'null'
        index:
          type: integer
    BaseRevision:
      type: object
      properties:
        base_revision:
          type: integer
      required:
      - base_revision
    RevisionHead:
      type: object
      properties:
        number:
          type: integer
        author:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        label:
          type:
          - string
          - 'null'
        format:
          type: string
        channel:
          type:
          - string
          - 'null'
          enum:
          - web
          - app
          - api
          - mcp
          - null
          description: Where the write came from (spec 234); null when not recorded.
        token_name:
          type:
          - string
          - 'null'
          maxLength: 120
          description: The host's plain-text actor label of the write (spec 234); null when not recorded or once the author
            is deleted.
      required:
      - number
      - author
      - created_at
      - label
      - format
      - channel
      - token_name
    RevisionList:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RevisionHead'
        last_page:
          type: boolean
      required:
      - revisions
      - last_page
    Revision:
      allOf:
      - $ref: '#/components/schemas/RevisionHead'
      - type: object
        properties:
          content_view:
            type: string
          content_markdown:
            type:
            - string
            - 'null'
          content_text:
            type: string
        required:
        - content_view
        - content_markdown
    Diff:
      type: object
      properties:
        from:
          type: integer
        to:
          type: integer
        lines:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - same
                - add
                - remove
              line:
                type: string
            required:
            - kind
            - line
      required:
      - from
      - to
      - lines
    Comment:
      type: object
      properties:
        id:
          type: string
        author:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        edited_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        deleted:
          type: boolean
        content_view:
          type: string
        body_markdown:
          type:
          - string
          - 'null'
      required:
      - id
      - author
      - created_at
      - edited_at
      - deleted
      - content_view
      - body_markdown
    Thread:
      type: object
      properties:
        id:
          type: string
        anchor:
          type:
          - string
          - 'null'
          enum:
          - inline
          - null
        quote:
          type:
          - string
          - 'null'
        resolved:
          type: boolean
        resolved_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        resolved_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        updated_at:
          type:
          - integer
          - 'null'
          description: Unix milliseconds.
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
