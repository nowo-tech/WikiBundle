# Bundle service definitions. Parameters are set by WikiExtension from config/packages/nowo_wiki.yaml.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\WikiBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../WikiBundle.php'
            - '../../Security/AttributeSanitizer/'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Ai/'
            - '../../Command/'
            - '../../Service/WikiSpaceAccessResolver.php'
            - '../../Service/WikiAuthorResolver.php'
            - '../../Attachment/LocalWikiAttachmentStorage.php'
            - '../../Attachment/ConfiguredWikiAttachmentLimitsProvider.php'
            - '../../Routing/WikiTenantPaths.php'
            - '../../Routing/WikiTenantUrlGenerator.php'
            - '../../Ui/'
            - '../../Interchange/HtmlToMarkdown/'
            - '../../Markdown/WikiTaskListNormalizer.php'

    Nowo\WikiBundle\Service\WikiAuthorResolver:
        arguments:
            $userClass: '%nowo_wiki.user_class%'

    # REQ-OBS-001: import / export / archive log start, success and failure on the nowo_wiki channel.
    Nowo\WikiBundle\Interchange\WikiDocumentImporter:
        arguments:
            $logger: '@?logger'
            $editorType: '%nowo_wiki.editor.type%'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    Nowo\WikiBundle\Interchange\WikiDocumentExporter:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    Nowo\WikiBundle\Service\WikiPageService:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    Nowo\WikiBundle\Command\:
        resource: '../../Command/'
        tags: ['console.command']
        bind:
            $enabled: '%nowo_wiki.import_export.enabled%'

    Nowo\WikiBundle\Controller\:
        resource: '../../Controller/'
        public: true

    Nowo\WikiBundle\Routing\WikiRouteLoader:
        arguments:
            $routes: '%nowo_wiki.routes%'
            $routePrefix: '%nowo_wiki.route_prefix%'
            $tenantPaths: '@Nowo\WikiBundle\Routing\WikiTenantPaths'
            $enabled: '%nowo_wiki.web_ui.enabled%'
        tags:
            - { name: routing.loader }

    Nowo\WikiBundle\Controller\WikiManageController:
        public: true
        arguments:
            $routes: '%nowo_wiki.routes%'
            $templates: '%nowo_wiki.templates%'
            $dashboardRoute: '%nowo_wiki.dashboard_route%'
            $editor: '%nowo_wiki.editor%'
            $importExport: '%nowo_wiki.import_export%'
            $allowUnauthenticated: '%nowo_wiki.security.allow_unauthenticated%'
            $pagination: '%nowo_wiki.pagination%'
            $attachments: '%nowo_wiki.attachments%'
            $pageFactory: '@Nowo\WikiBundle\Ui\WikiPageFactory'
            $translator: '@?translator'

    Nowo\WikiBundle\Controller\WikiAttachmentController:
        public: true
        arguments:
            $routes: '%nowo_wiki.routes%'
            $attachments: '%nowo_wiki.attachments%'
            $accessChecker: '@Nowo\WikiBundle\Security\WikiAccessCheckerInterface'

    # 1.9: the attachment service logs on the nowo_wiki channel.
    Nowo\WikiBundle\Attachment\WikiAttachmentService:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\WikiBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']
