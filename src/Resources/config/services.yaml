# Bundle service definitions. Parameters are set by WikiExtension from config/packages/nowo_wiki.yaml.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\WikiBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            # 1.24: the REST API, loaded by services_api.yaml only with api.enabled.
            - '../../Api/'
            - '../../WikiBundle.php'
            - '../../Security/AttributeSanitizer/'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Ai/'
            - '../../Command/'
            # 1.21: a per-request value object (it holds the refusal), never a shared service.
            - '../../Event/WikiQuotaCheckEvent.php'
            - '../../Event/WikiApiWriteEvent.php'
            - '../../User/WikiUserId.php'
            - '../../User/WikiUserFields.php'
            - '../../Service/WikiSpaceAccessResolver.php'
            - '../../Service/WikiAuthorResolver.php'
            - '../../Attachment/LocalWikiAttachmentStorage.php'
            - '../../Attachment/ConfiguredWikiAttachmentLimitsProvider.php'
            - '../../Routing/WikiTenantPaths.php'
            - '../../Routing/WikiTenantUrlGenerator.php'
            - '../../Ui/'
            - '../../Interchange/HtmlToMarkdown/'
            - '../../Markdown/WikiTaskListNormalizer.php'
            # 1.24: one per render, made by WikiRenderContext, never a shared service.
            - '../../Markdown/WikiRenderFrame.php'
            - '../../Markdown/WikiRenderReachIntersection.php'
            - '../../Markdown/Milkdown/'
            - '../../Collaboration/'
            - '../../Controller/'
            # 1.14: registered by WikiExtension only with tree.enabled (controllers get null otherwise).
            - '../../Tree/'
            - '../../Trash/'
            - '../../History/'
            - '../../Service/WikiPageMover.php'
            # 1.16: registered by WikiExtension (comments only with comments.enabled; avatars always, by alias).
            - '../../Comment/'
            - '../../Panel/'
            - '../../Avatar/'
            # 1.20: registered by WikiExtension only with page_files.enabled (the page view gets null otherwise).
            - '../../PageFile/'
            - '../../Search/'
            # 1.33: port gates and helpers, wired by WikiPortsPass / WikiExtension only.
            - '../../Port/'

    Nowo\WikiBundle\Service\WikiAuthorResolver:
        arguments:
            $userClass: '%nowo_wiki.user_class%'

    # Audit GV-L3: the per-document limit of an import.
    Nowo\WikiBundle\Interchange\WikiArchiveHelper:
        arguments:
            $maxDocumentBytes: '%nowo_wiki.import_export.max_document_bytes%'

    Nowo\WikiBundle\Interchange\WikiMarkdownFileReader:
        arguments:
            $maxDocumentBytes: '%nowo_wiki.import_export.max_document_bytes%'

    # REQ-OBS-001: import / export / archive log start, success and failure on the nowo_wiki channel.
    Nowo\WikiBundle\Interchange\WikiDocumentImporter:
        arguments:
            $logger: '@?logger'
            $editorType: '%nowo_wiki.editor.type%'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    Nowo\WikiBundle\Interchange\WikiDocumentExporter:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    # 1.15.1: README.md index of every export, translated in the NowoWikiBundle domain when a translator exists.
    Nowo\WikiBundle\Interchange\WikiExportIndexWriter:
        arguments:
            $translator: '@?translator'

    # 1.27: the stored user relation for a security user that is no user_class entity (hosts alias the interface).
    # 1.27 (audit JX-W1): only user_class and the listed accepted classes map to a user_class row by getId().
    Nowo\WikiBundle\User\WikiUserClassPolicy:
        arguments:
            $userClass: '%nowo_wiki.user_class%'
            $acceptedUserClasses: '%nowo_wiki.accepted_user_classes%'

    Nowo\WikiBundle\User\DoctrineWikiUserReferenceResolver:
        arguments:
            $userClass: '%nowo_wiki.user_class%'
            $entityManagers: '@Nowo\WikiBundle\Doctrine\WikiEntityManagerProvider'
            $classes: '@Nowo\WikiBundle\User\WikiUserClassPolicy'
            $userReference: '%nowo_wiki.database.user_reference%'

    # 1.33 (database.user_reference: id): the host users behind stored ids, found through user_directory; per unit of
    # work (emptied by WikiRequestBoundaryResetter at every boundary and at kernel.reset).
    Nowo\WikiBundle\User\WikiUsers:
        arguments:
            $mode: '%nowo_wiki.database.user_reference%'
            $directory: '@?Nowo\WikiBundle\User\WikiUserDirectoryInterface'
        tags:
            - { name: kernel.reset, method: reset }

    Nowo\WikiBundle\User\WikiUserReferenceResolverInterface: '@Nowo\WikiBundle\User\DoctrineWikiUserReferenceResolver'

    # 1.27: ports of the services hosts call (public aliases; decorate or replace them in your tests).
    Nowo\WikiBundle\Service\WikiPageServiceInterface:
        alias: Nowo\WikiBundle\Service\WikiPageService
        public: true
    Nowo\WikiBundle\Service\WikiSpaceServiceInterface:
        alias: Nowo\WikiBundle\Service\WikiSpaceService
        public: true
    Nowo\WikiBundle\Link\WikiPageLinkServiceInterface:
        alias: Nowo\WikiBundle\Link\WikiPageLinkService
        public: true

    # 1.33: the same operations by id and value objects (REQ-ARCH-001 rule 1; public aliases).
    Nowo\WikiBundle\Service\WikiPageOperationsInterface:
        alias: Nowo\WikiBundle\Service\WikiPageOperations
        public: true
    Nowo\WikiBundle\Service\WikiSpaceOperationsInterface:
        alias: Nowo\WikiBundle\Service\WikiSpaceOperations
        public: true
    Nowo\WikiBundle\Link\WikiPageLinkOperationsInterface:
        alias: Nowo\WikiBundle\Link\WikiPageLinkOperations
        public: true

    Nowo\WikiBundle\Service\WikiPageService:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    Nowo\WikiBundle\Command\:
        resource: '../../Command/'
        tags: ['console.command']
        bind:
            $enabled: '%nowo_wiki.import_export.enabled%'

    # REQ-SF-004 rule 7: controllers are registered explicitly, NOT autoconfigured (no #[AsController]). On
    # Symfony >= 7.3 a #[Route] class is autoconfigured with the routing.controller tag and the host's
    # `routing.controllers` resource would expose /tools/wiki/... without the nowo_wiki route loader (bypassing
    # nowo_wiki.routes, route_prefix and web_ui.enabled: false).
    Nowo\WikiBundle\Controller\:
        resource: '../../Controller/'
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # 1.24 (audit IF-L2): events held until the outermost commit; request state.
    Nowo\WikiBundle\Service\WikiEventDeferral:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: kernel.reset, method: reset }

    # 1.24 (spec 218): render frames are request state; emptied between requests in worker mode (audit IF-I7).
    Nowo\WikiBundle\Markdown\WikiRenderContext:
        tags:
            - { name: kernel.reset, method: reset }

    Nowo\WikiBundle\Routing\WikiRouteLoader:
        arguments:
            $routes: '%nowo_wiki.routes%'
            $routePrefix: '%nowo_wiki.route_prefix%'
            $tenantPaths: '@Nowo\WikiBundle\Routing\WikiTenantPaths'
            $enabled: '%nowo_wiki.web_ui.enabled%'
        tags:
            - { name: routing.loader }

    Nowo\WikiBundle\Controller\WikiManageController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_wiki.routes%'
            $templates: '%nowo_wiki.templates%'
            $dashboardRoute: '%nowo_wiki.dashboard_route%'
            $editor: '%nowo_wiki.editor%'
            $importExport: '%nowo_wiki.import_export%'
            $allowUnauthenticated: '%nowo_wiki.security.allow_unauthenticated%'
            $pagination: '%nowo_wiki.pagination%'
            $attachments: '%nowo_wiki.attachments%'
            $pageFactory: '@Nowo\WikiBundle\Ui\WikiPageFactory'
            $translator: '@?translator'
            $searchScope: '%nowo_wiki.search.scope%'
            $layout: '%nowo_wiki.web_ui.layout%'
            # 1.30: optional BreadcrumbKit >= 2.17 (web_ui.breadcrumb_current_label); null without it
            $breadcrumbCurrentLabel: '@?Nowo\BreadcrumbKitBundle\Service\BreadcrumbCurrentLabelInterface'

    Nowo\WikiBundle\Controller\WikiHistoryController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_wiki.routes%'
            $pageFactory: '@Nowo\WikiBundle\Ui\WikiPageFactory'
            $translator: '@?translator'

    Nowo\WikiBundle\Controller\WikiTrashController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_wiki.routes%'
            $pageFactory: '@Nowo\WikiBundle\Ui\WikiPageFactory'
            $translator: '@?translator'

    Nowo\WikiBundle\Controller\WikiTreeController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\WikiBundle\Controller\WikiCollabController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_wiki.routes%'

    # 1.16: comment endpoints and the panel state (404 without comments.enabled: the service is then null; 1.29: the
    # panel state also with web_ui.tree_rail).
    Nowo\WikiBundle\Controller\WikiCommentController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_wiki.routes%'
            $translator: '@?translator'
            $layout: '%nowo_wiki.web_ui.layout%'

    Nowo\WikiBundle\Controller\WikiAttachmentController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_wiki.routes%'
            $attachments: '%nowo_wiki.attachments%'
            $accessChecker: '@Nowo\WikiBundle\Security\WikiAccessCheckerInterface'

    # 1.9: the attachment service logs on the nowo_wiki channel.
    Nowo\WikiBundle\Attachment\WikiAttachmentService:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: monolog.logger, channel: nowo_wiki }

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\WikiBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']

    # 1.32: the space icon field checks the configured icon set prefixes.
    Nowo\WikiBundle\Form\WikiSpaceIconType:
        arguments:
            $allowedPrefixes: '%nowo_wiki.space_icon.allowed_prefixes%'
            $iconRenderer: '@?Symfony\UX\Icons\IconRendererInterface'
        tags: ['form.type']
