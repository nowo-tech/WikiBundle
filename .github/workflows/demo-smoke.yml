# REQ-TEST-011: demo smoke. Boots the FrankenPHP demo and asserts HTTP 200 on /tools/wiki (`make demo-smoke`).
name: Demo smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  demo-smoke:
    name: Demo release-verify (HTTP 200)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Compose
        run: docker compose version

      - name: Run demo smoke (REQ-TEST-011)
        run: make demo-smoke
