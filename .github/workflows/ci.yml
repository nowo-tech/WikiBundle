# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.1 (exclusions for incompatible pairs).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master, 1.x]
  pull_request:
    branches: [main, master, 1.x]

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md|\.github/workflows/.*)$' # TEMP pilot measurement only: reverted before merge
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}
    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, pdo
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: SearchKit >= 1.10.1 on PHP >= 8.3 (the wiki's SearchKit group; nothing on 8.2)
        if: env.HEAVY == 'true'
        run: .github/ci/search-kit.sh

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          SYMFONY="${{ matrix.symfony }}"
          SYMFONY_MAJOR="${SYMFONY%%.*}"
          if [ "$SYMFONY_MAJOR" -ge 8 ]; then
            DOCTRINE_BUNDLE="^3.0"
          else
            DOCTRINE_BUNDLE="^2.10"
          fi
          echo "Using doctrine/doctrine-bundle ${DOCTRINE_BUNDLE} with Symfony ^${SYMFONY}"
          composer require \
            symfony/config:^${SYMFONY} \
            symfony/dependency-injection:^${SYMFONY} \
            symfony/form:^${SYMFONY} \
            symfony/framework-bundle:^${SYMFONY} \
            symfony/http-kernel:^${SYMFONY} \
            symfony/routing:^${SYMFONY} \
            symfony/security-bundle:^${SYMFONY} \
            symfony/translation:^${SYMFONY} \
            symfony/twig-bundle:^${SYMFONY} \
            symfony/validator:^${SYMFONY} \
            symfony/yaml:^${SYMFONY} \
            symfony/var-exporter:^${SYMFONY} \
            doctrine/doctrine-bundle:${DOCTRINE_BUNDLE} \
            --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      # 1.46: on 8.4, where SearchKit (PHP >= 8.3) is installed and the SearchKit group counts.
      - name: Run tests with coverage (PHP 8.4 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && (matrix.php == '8.4' && matrix.symfony == '7.4')
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage-100
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  mysql:
    name: Database tests on MySQL
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the database suite against MySQL
        env:
          WIKI_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/wiki_test?serverVersion=8.4.0&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite database,api

      # REQ-SEC-006: the bundle's own gate over its own identity / access-key column declaration.
      - name: Run the identity / access-key collation gate against MySQL
        env:
          WIKI_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/wiki_test?serverVersion=8.4.0&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite collation

  mariadb:
    name: Look-alike owner test on MariaDB
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # 1.31.1 (house rule LQ): MariaDB's default collation is PAD SPACE, so the look-alike owner test runs here too.
      # Since 1.48 the whole suite also runs on MariaDB ("Database tests on MariaDB", "Load readiness"); this job keeps
      # its focused steps under its required-check name.
      - name: Run the look-alike owner test against MariaDB
        env:
          WIKI_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/wiki_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- tests/Database/WikiSpaceLookalikeOwnerTest.php

      # 1.36 (database.user_reference: id, REQ-SEC-006): the stored user id columns and their exact matching.
      - name: Run the user id reference test against MariaDB
        env:
          WIKI_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/wiki_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- tests/Database/WikiUserReferenceByIdTest.php

      # REQ-SEC-006: the declaration gate, on MariaDB's utf8mb4_nopad_bin.
      - name: Run the identity / access-key collation gate against MariaDB
        env:
          WIKI_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/wiki_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite collation

      # 1.45: favourites, recents and backlinks, with the two-connection races (lock conflict, unique-key race).
      - name: Run the favourites, recents and backlinks tests against MariaDB
        env:
          WIKI_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/wiki_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          composer test -- tests/Database/WikiQuickAccessTest.php
          composer test -- tests/Database/WikiBacklinksTest.php
          composer test -- tests/Database/WikiQuickAccessRaceTest.php

  mariadb-database:
    # 1.48 (REQ-RUNTIME-003): the whole database and REST API suites on MariaDB 11.4.
    name: Database tests on MariaDB
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the database suite against MariaDB
        env:
          WIKI_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/wiki_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite database,api

  pgsql:
    name: Database tests on PostgreSQL
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: wiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wiki_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the database suite against PostgreSQL
        env:
          WIKI_TEST_DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/wiki_test?serverVersion=16&charset=utf8
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite database,api

  load-readiness:
    # 1.37 (Beacon spec 239): the races of the write paths on real servers, DBAL 4 and DBAL 3 (passwordless services);
    # MariaDB 11.4 since 1.48 (REQ-RUNTIME-003).
    name: Load readiness (${{ matrix.database }}, DBAL ${{ matrix.dbal }})
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        database: ['MySQL 8.4', 'MariaDB 11.4', 'PostgreSQL 16']
        dbal: ['4', '3']
    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    services:
      mysql:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      mariadb:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: wiki_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      postgres:
        image: ${{ needs.changes.outputs.mode != 'light' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wiki_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Light mode (deps/docs-only PR) - no run for this cell
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: DBAL 3
        if: env.HEAVY == 'true' && (matrix.dbal == '3')
        run: composer update doctrine/dbal:^3.8.2 --with-all-dependencies --no-progress --no-interaction

      - name: Run the load-readiness and database suites
        if: env.HEAVY == 'true'
        env:
          WIKI_TEST_DATABASE_URL: ${{ matrix.database == 'MySQL 8.4' && 'mysql://root@127.0.0.1:3306/wiki_test?serverVersion=8.4.0&charset=utf8mb4' || matrix.database == 'MariaDB 11.4' && 'mysql://root@127.0.0.1:3307/wiki_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4' || 'postgresql://postgres@127.0.0.1:5432/wiki_test?serverVersion=16&charset=utf8' }}
        run: |
          composer show doctrine/dbal | grep -E '^versions'
          vendor/bin/phpunit --fail-on-skipped tests/Database/LoadReadinessTest.php
          vendor/bin/phpunit --fail-on-skipped tests/Database/LoadReadinessConcurrencyTest.php
          vendor/bin/phpunit --testsuite database

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 1.46: 8.4, so SearchKit (PHP >= 8.3) is installed and the SearchKit group counts (.github/ci/search-kit.sh);
          # the 8.2 test cell and the floor job still check the 8.2 floor.
          php-version: '8.4'
          extensions: json, pdo, pdo
          coverage: pcov
          tools: composer:v2

      - name: SearchKit >= 1.10.1 (the wiki's SearchKit group)
        run: .github/ci/search-kit.sh

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/form:^7.4 symfony/framework-bundle:^7.4 symfony/http-foundation:^7.4 symfony/http-kernel:^7.4 symfony/routing:^7.4 symfony/twig-bundle:^7.4 symfony/web-profiler-bundle:^7.4 symfony/var-exporter:^7.4 doctrine/doctrine-bundle:^2.10 --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          rm -rf .phpunit.cache
          composer test-coverage-100
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "✅ coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # 1.46: 8.4, so the SearchKit group is analysed (the floor job still runs PHPStan on 8.2 without it).
          php-version: '8.4'
          extensions: json, pdo, pdo
          tools: composer:v2

      - run: .github/ci/search-kit.sh
      - run: composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction
      - run: composer phpstan

  release-gates:
    name: Release gate (make ${{ matrix.gate }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        gate: ['rector-dry', 'validate-phpdoc', 'validate-translations', 'check-twig-extra']

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
      GATE: ${{ matrix.gate }}
    steps:
      - name: Light mode (deps/docs-only PR) - release gates run in full mode only
        if: env.HEAVY != 'true'
        run: echo "Light mode, this gate runs on full-mode PRs and on every push."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Is make ${{ matrix.gate }} defined in this repo?
        if: env.HEAVY == 'true'
        id: gate
        run: |
          # Defined = the Makefile has a rule with a recipe for the target. Skip only on these two exact make answers;
          # any other make error (broken Makefile, missing include) fails the cell instead of hiding the gate.
          run=false
          if [ ! -f Makefile ]; then
            reason="no Makefile in this repo"
          else
            set +e
            plan=$(LC_ALL=C make -n -o ensure-up -o install "$GATE" 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && printf '%s\n' "$plan" | grep -qF "No rule to make target '$GATE'.  Stop."; then
              reason="the Makefile has no '$GATE' target"
            elif [ "$rc" -eq 0 ] && printf '%s\n' "$plan" | grep -qF "Nothing to be done for '$GATE'."; then
              reason="the Makefile declares '$GATE' without a recipe"
            elif [ "$rc" -ne 0 ]; then
              printf '%s\n' "$plan"
              echo "::error title=Release gate $GATE::make -n $GATE failed (exit $rc), see the output above"
              exit 1
            else
              run=true
              echo "make $GATE runs (docker compose exec/run prefixes are dropped, the command runs on the runner):"
              printf '%s\n' "$plan"
            fi
          fi
          if [ "$run" = false ]; then
            echo "::notice title=Release gate $GATE skipped::$reason, nothing to check."
            echo "Release gate \`$GATE\` skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.gate.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          # Same PHP as this repo's phpstan job
          php-version: '8.4'
          tools: composer:v2

      - name: Get Composer cache directory
        if: steps.gate.outputs.run == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-release-gates-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-release-gates-composer-
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: make ${{ matrix.gate }}
        if: steps.gate.outputs.run == 'true'
        run: |
          # Stand-in for `docker compose`: `[global options] exec|run [options] <service> <command...>` runs <command>
          # here (-e VAR=value is exported, an absolute binary path missing on the runner is looked up on PATH). Any
          # other compose call (up, ps, ...) fails loudly: the gate needs a stack CI does not start.
          shim="$RUNNER_TEMP/compose-on-runner"
          cat > "$shim" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          sub=""
          while [ $# -gt 0 ]; do
            case "$1" in
              exec|run) sub=$1; shift; break ;;
              -f|--file|-p|--project-name|--project-directory|--env-file|--profile|--ansi|--progress) shift 2 ;;
              -*) shift ;;
              *) break ;;
            esac
          done
          if [ -z "$sub" ]; then echo "compose-on-runner: 'compose $*' needs the Docker stack, CI has none" >&2; exit 1; fi
          while [ $# -gt 0 ]; do
            case "$1" in
              -e|--env) export "$2"; shift 2 ;;
              --env=*) export "${1#--env=}"; shift ;;
              -w|--workdir|-u|--user|--name|--entrypoint|--index) shift 2 ;;
              -*) shift ;;
              *) shift; break ;;
            esac
          done
          if [ $# -eq 0 ]; then echo "compose-on-runner: no command after the service" >&2; exit 1; fi
          if [ "${1#/}" != "$1" ] && [ ! -x "$1" ]; then set -- "${1##*/}" "${@:2}"; fi
          exec "$@"
          SHIM
          chmod +x "$shim"
          make -o ensure-up -o install COMPOSE="$shim" COMPOSE_BIN="$shim" "$GATE"

  twin-ports:
    name: API suite through the framework-free ports
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      # 1.36 (REQ-ARCH-001): every API host port answered through its twin only (equivalence with the deprecated ports).
      - name: Run the API suite with WIKI_TEST_PORTS=twin
        env:
          WIKI_TEST_PORTS: twin
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite api

  searchkit-bridge:
    # 1.44 (Beacon KIT-85), 1.46 (provider base): the optional SearchKit group against the real SearchKitBundle (^1.10.1, the provider base with the 1.10.1 kit)
    # (PHP >= 8.3), with SearchKit's provider contract kit and the wiki's own tests, on SQLite, MySQL, MariaDB and
    # PostgreSQL. No stub: without SearchKit these tests are skipped (the PHP 8.2 jobs).
    name: SearchKit bridge (SearchKit ${{ matrix.searchkit }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    strategy:
      fail-fast: false
      matrix:
        searchkit: ['^1.10.1']
        database: ['SQLite', 'MySQL 8.4', 'MariaDB 11.4', 'PostgreSQL 16']
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: wiki_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wiki_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies with SearchKit ${{ matrix.searchkit }}
        env:
          SEARCH_KIT_CONSTRAINT: ${{ matrix.searchkit }}
        run: |
          .github/ci/search-kit.sh
          composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction
          composer show nowo-tech/search-kit-bundle | grep -E '^versions'

      - name: Run the SearchKit group tests
        env:
          WIKI_TEST_DATABASE_URL: ${{ matrix.database == 'MySQL 8.4' && 'mysql://root@127.0.0.1:3306/wiki_test?serverVersion=8.4.0&charset=utf8mb4' || (matrix.database == 'MariaDB 11.4' && 'mysql://root@127.0.0.1:3307/wiki_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4' || (matrix.database == 'PostgreSQL 16' && 'postgresql://postgres@127.0.0.1:5432/wiki_test?serverVersion=16&charset=utf8' || '')) }}
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          # The real SearchKit (provider base, contract kit) is installed and autoloaded.
          php -r 'require "vendor/autoload.php"; exit(class_exists(Nowo\SearchKitBundle\Test\EntitySearchProviderTestCase::class) ? 0 : 1);'
          vendor/bin/phpunit --fail-on-skipped tests/Unit/Search tests/Unit/Event/WikiSearchSpacesEventTest.php tests/Unit/DependencyInjection/WikiExtensionSearchKitTest.php tests/Unit/DependencyInjection/Compiler/WikiSearchKitPassTest.php tests/Database/WikiReadablePageFinderTest.php tests/Database/WikiSearchPlainTextApiTest.php tests/Api/SearchKit tests/Api/SearchKitProviderTest.php tests/Api/SearchKitProviderSessionTest.php tests/Unit/Security/ConfigurableWikiAccessCheckerTest.php

  private-entity-manager:
    name: API and database suites through the private entity manager
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo_mysql
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      # 1.36 (REQ-ARCH-001 rule 6): every wiki write through the opt-in private entity manager, on SQLite and MySQL.
      - name: Run the API suite with WIKI_TEST_PRIVATE_EM=1 (SQLite)
        env:
          WIKI_TEST_PRIVATE_EM: '1'
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite api
      - name: Run the API suite with WIKI_TEST_PRIVATE_EM=1 (MySQL)
        env:
          WIKI_TEST_PRIVATE_EM: '1'
          WIKI_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/wiki_test?serverVersion=8.4.0&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite api

  typescript:
    name: Vitest (TypeScript)
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage

  security-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-pdo

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer audit

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/wiki-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test
