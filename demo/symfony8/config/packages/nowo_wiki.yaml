nowo_wiki:
    user_class: App\Entity\User
    space_scope: user
    # 1.13: pages are written in the Milkdown dialect (MilkdownEditorType, the Milkdown ↔ wiki bridge renderer).
    # The seeded HTML pages stay HTML until edited or converted (bin/console wiki:convert-markdown).
    editor:
        type: milkdown
        # 1.14: "Copy as Markdown" on the page view, for editors (Milkdown 1.5).
        milkdown:
            copy_markdown: true
    # 1.14: the Outline-style page tree (UiKit tree: fold state, drag, Alt+arrows, Move form).
    tree:
        enabled: true
    # 1.14 (T065): Delete moves a page and its sub-pages to the trash (restore, purge, 30-day retention).
    trash:
        enabled: true
    ai:
        enabled: true
        agent: wiki_assistant
        context_injection: true
    routes:
        index:
            path: /tools/wiki
            name: nowo_wiki_index
