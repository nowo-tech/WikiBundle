framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: [en]
    php_errors:
        log: true
    # 1.16: nowo_wiki.comments.rate_limiter (comment writes per user and page).
    rate_limiter:
        wiki_comments:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
